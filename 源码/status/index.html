<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>无限画布</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: var(--oc-bg, transparent);
        --fg: var(--oc-fg, #111111);
        --muted: var(--oc-muted, #6b7280);
        --border: var(--oc-border, #e5e7eb);
        --hover: var(--oc-hover, rgba(0, 0, 0, 0.04));
        --subtle: var(--oc-subtle, #f9fafb);
        --primary: var(--oc-primary, #2563eb);
        --primary-fg: var(--oc-primary-fg, #ffffff);
        --ok: var(--oc-success-text, #15803d);
        --warn: var(--oc-warning-text, #b45309);
        --err: var(--oc-error-text, #b91c1c);
        --radius: var(--oc-radius, 8px);
        --font: var(--oc-font, system-ui, -apple-system, "Segoe UI", sans-serif);
        --mono: var(--oc-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      }

      html, body { margin: 0; background: var(--bg); }
      body {
        font-family: var(--font);
        font-size: 12px;
        line-height: 1.4;
        color: var(--fg);
        background: transparent;
      }

      #root { display: flex; flex-direction: column; gap: 7px; padding: 2px 2px 6px; }

      /* 侧边栏面板里是整页，别让卡片拉成一条；状态区里保持贴边。 */
      body[data-surface="panel"] { padding: 14px; }
      body[data-surface="panel"] #root { max-width: 460px; margin: 0 auto; gap: 10px; }

      .head { display: flex; align-items: center; gap: 6px; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
      .dot[data-state="on"] { background: var(--ok); }
      .dot[data-state="half"] { background: var(--warn); }
      .dot[data-state="off"] { background: var(--muted); }
      .title { font-weight: 600; }
      .head .spacer { flex: 1; }
      .tag { color: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }

      .rows { display: flex; flex-direction: column; gap: 1px; }
      .row { display: flex; align-items: baseline; gap: 6px; padding: 1px 2px; }
      .row .k { color: var(--muted); flex: none; width: 62px; }
      .row .v { flex: 1; min-width: 0; }
      .row .v[data-tone="ok"] { color: var(--ok); }
      .row .v[data-tone="warn"] { color: var(--warn); }
      .row .v[data-tone="err"] { color: var(--err); }
      .row .v[data-tone="muted"] { color: var(--muted); }

      .actions { display: flex; gap: 6px; align-items: center; }
      button { font: inherit; cursor: pointer; border-radius: calc(var(--radius) - 2px); }
      button:disabled { opacity: 0.55; cursor: default; }
      .primary {
        flex: 1;
        border: 1px solid transparent;
        background: var(--primary);
        color: var(--primary-fg);
        padding: 5px 10px;
        font-weight: 600;
      }
      .primary[data-mode="off"] { background: transparent; color: var(--fg); border-color: var(--border); }
      .ghost {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        padding: 5px 10px;
      }
      .ghost:hover:not(:disabled), .primary[data-mode="off"]:hover:not(:disabled) { background: var(--hover); }

      .note { color: var(--muted); font-size: 10.5px; min-height: 13px; word-break: break-word; white-space: pre-wrap; }
      .note[data-tone="err"] { color: var(--err); }
      .note[data-tone="ok"] { color: var(--ok); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="main.js"></script>
  </body>
</html>
