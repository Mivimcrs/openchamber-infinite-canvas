name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装构建依赖
        run: npm ci --prefix 源码

      - name: 构建与自检（typecheck / manifest / 官方 guest 检查 / 仓库卫生）
        run: npm --prefix 源码 run check

      - name: 打包（只带可安装的扩展包）
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          ZIP="openchamber-infinite-canvas-${VERSION}.zip"
          zip -r "$ZIP" package.json icon.svg status service README.md LICENSE
          unzip -l "$ZIP"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: openchamber-infinite-canvas-${{ env.VERSION }}
          path: ${{ env.ZIP }}
          if-no-files-found: error

      - name: 发布 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
